<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="icon" type="image/png" href="../Dry-Fruits/Photos/favicon.png" sizes="32x32">
    <title>Reset Password - RR Dryfruits</title>
    <style>
        body {
            background-color: #F2D8C1; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 8px 12px 25px rgba(132, 85, 54, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .login-card i.fa-lock {
            font-size: 50px;
            color: #845536;
            margin-bottom: 20px;
        }
        .login-card h2 {
            color: #170804;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .login-card p.desc {
            color: #555555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            color: #170804;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .input-group input {
            padding: 12px 15px;
            border: 1.5px solid #dddddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-group input:focus {
            border-color: #845536;
        }
        .login-btn {
            background-color: #845536;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-bottom: 25px;
        }
        .login-btn:hover {
            background-color: #170804;
            transform: translateY(-3px);
        }
        .back-link {
            color: #555555;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .back-link i {
            margin-right: 5px;
        }
        .back-link:hover {
            color: #170804;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-lock"></i>
        <h2>Forgot Password?</h2>
        <p class="desc">Enter the email address associated with your account and we will send you a link to reset your password.</p>
        <form class="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="login-btn">Send Reset Link</button>
        </form>
        <a href="Login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
</body>
</html>
